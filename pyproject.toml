[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-rust-analyzer"
version = "0.1.0"
description = "MCP server that exposes rust-analyzer as tools for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jason Ricca" },
]
keywords = ["mcp", "rust-analyzer", "lsp", "claude-code", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
mcp-rust-analyzer = "mcp_rust_analyzer.__main__:main"

[project.urls]
Repository = "https://github.com/jasonricca/mcp-rust-analyzer"
